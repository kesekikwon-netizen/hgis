name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secrets or API keys: both jobs only read the repository.
permissions:
  contents: read

jobs:
  # Quick checks on Linux before the Windows build. Compiles nothing.
  sanity:
    name: Sanity checks (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Required paths exist
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f README.md
          test -f LICENSE
          test -f VERSION
          test -f VERSION_QGIS_PIN.txt
          test -f data/rules/drawing_checklist.v1.json
          test -f data/schemas/ka_hgis_layers.yaml
          test -f src/app/main.cpp
          test -f src/core/ChecklistEngine.cpp
          test -f tests/test_checklist.cpp
          test -f scripts/dev-env.ps1
          test -f scripts/run-ka-hgis.ps1
          test -f scripts/e2e-smoke.ps1
          echo "Required paths OK"

      # These files keep their UTF-8 BOM on purpose: Windows PowerShell 5.1 reads
      # BOM-less UTF-8 as the ANSI code page (CP949), and scripts/e2e-smoke.ps1
      # reads the checklist without -Encoding. Accept the BOM here instead.
      - name: Validate checklist JSON
        run: python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' data/rules/drawing_checklist.v1.json

      - name: Validate sample survey JSON
        run: |
          set -euo pipefail
          for f in samples/demo_survey/demo.ka-survey.json samples/bad_survey/bad.ka-survey.json; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$f"
          done

      - name: CMakeLists basic shape
        run: |
          set -euo pipefail
          grep -q 'project(ka-hgis' CMakeLists.txt
          grep -q 'add_executable(ka-hgis' CMakeLists.txt
          grep -q 'add_library(ka_core' CMakeLists.txt
          grep -q 'KA_HGIS_BUILD_TESTS' CMakeLists.txt
          echo "CMakeLists shape OK"

      - name: Secret scan (tracked files)
        run: |
          set -euo pipefail
          python3 scripts/secret-scan.py

      # F213: no new C++ file over 300 lines; files already over (docs/quality/line-limit-baseline.txt)
      # may shrink but not grow.
      - name: Source line limit
        shell: pwsh
        run: ./scripts/scorecard.ps1 -LineLimitOnly

  # Full build, every CTest group and an app start on GitHub's free Windows runner (the
  # repository is public). windows-latest now ships only Visual Studio 2026, while the "vs"
  # preset and the reference PC use Visual Studio 2022, so the job stays on windows-2022.
  # It runs next to the sanity job, so a line-count or JSON slip never hides the build result.
  windows:
    name: Windows build and tests
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      OSGEO4W_ROOT: C:\OSGeo4W
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The OSGeo4W packages of the reference PC (dev-env.lock.json). OSGeo4W serves the newest
      # qgis-dev, so the cached install is renewed every week and whenever the lock file changes.
      - name: OSGeo4W package list
        id: osgeo4w
        shell: pwsh
        run: |
          $lock = Get-Content -Raw dev-env.lock.json | ConvertFrom-Json
          $names = @($lock.required.osgeo4wPackages.PSObject.Properties.Name)
          if ($names.Count -lt 10) { throw "dev-env.lock.json lists only $($names.Count) OSGeo4W packages" }
          "packages=$($names -join ',')" >> $env:GITHUB_OUTPUT
          "week=$(Get-Date -UFormat '%G-%V')" >> $env:GITHUB_OUTPUT

      - name: Restore OSGeo4W
        id: osgeo4w-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\OSGeo4W
          key: osgeo4w-${{ hashFiles('dev-env.lock.json') }}-${{ steps.osgeo4w.outputs.week }}

      - name: Install OSGeo4W (qgis-dev)
        if: steps.osgeo4w-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'osgeo4w-setup.exe'
          Invoke-WebRequest -Uri 'https://download.osgeo.org/osgeo4w/v2/osgeo4w-setup.exe' -OutFile $setup -MaximumRetryCount 3 -RetryIntervalSec 15
          $setupArgs = @('-q', '-k', '-n', '-r', '-O', '-a', 'x86_64',
                         '-s', 'https://download.osgeo.org/osgeo4w/v2',
                         '-R', 'C:\OSGeo4W', '-l', (Join-Path $env:RUNNER_TEMP 'osgeo4w-packages'),
                         '-P', '${{ steps.osgeo4w.outputs.packages }}')
          $p = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            $log = 'C:\OSGeo4W\var\log\setup.log.full'
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 }
            throw "osgeo4w-setup exit $($p.ExitCode)"
          }
          # The opencl package moves opencl.dll into System32, which the cache does not keep, while
          # qgis_core.dll imports it. Keep a copy inside OSGeo4W so a restored cache still starts.
          $ocl = 'C:\OSGeo4W\bin\opencl.dll'
          $system = Join-Path $env:WINDIR 'System32\OpenCL.dll'
          if (-not (Test-Path -LiteralPath $ocl) -and (Test-Path -LiteralPath $system)) { Copy-Item -LiteralPath $system -Destination $ocl }
          foreach ($f in 'apps\qgis-dev\lib\qgis_core.lib', 'apps\gdal-dev\lib\gdal_i.lib', 'apps\Qt6\bin\Qt6Core.dll', 'bin\opencl.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path 'C:\OSGeo4W' $f))) { throw "OSGeo4W install is missing $f" }
          }

      # Saved right after the install, so a later failing step does not force the next run to
      # download about a hundred packages again.
      - name: Save OSGeo4W
        if: steps.osgeo4w-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\OSGeo4W
          key: ${{ steps.osgeo4w-cache.outputs.cache-primary-key }}

      # CI builds against the newest nightly qgis-dev; the versions tell an OSGeo4W update apart
      # from a change in this repository.
      - name: OSGeo4W versions
        shell: pwsh
        run: |
          Get-Content -LiteralPath 'C:\OSGeo4W\etc\setup\installed.db' |
            Select-String -Pattern '^(qgis-dev|gdal-dev|qt6-libs) '

      # Same order as scripts/build-all.ps1: configure, build, CTest, start the app.
      - name: Configure (VS 2022 x64)
        timeout-minutes: 15
        shell: pwsh
        run: |
          . .\scripts\dev-env.ps1
          cmake --preset vs

      # Two compiler processes per project keep the 16 GB runner clear of out-of-memory errors (C1060).
      - name: Build Release
        timeout-minutes: 150
        shell: pwsh
        run: |
          . .\scripts\dev-env.ps1
          cmake --build build --config Release --parallel -- /p:CL_MPCount=2

      # Two tests at a time keep the timing-sensitive groups steady on a 4-core runner. Failed
      # tests get one more run; scripts/ci/flaky-gate.mjs names any that pass it and keeps the job
      # red unless docs/quality/flaky-quarantine.txt lists them. perf budgets scale against the
      # reference PC's calibration (TEST_INFRA.md).
      - name: CTest
        timeout-minutes: 150
        shell: pwsh
        env:
          KA_PERF_CALIBRATION_REF_MS: '14'
          # The polygon calibration is fast here, but A3 PDF export swings far more than on the
          # reference PC (2026-10-02: medians 33 and 77 ms against 27 ms). Only that gate gets a
          # CI ceiling against gross regressions; the other budgets stay as they are.
          KA_PERF_BUDGET_A3_PDF_EXPORT: '160'
        run: |
          . .\scripts\dev-env.ps1
          ctest --test-dir build -C Release -j2 --output-on-failure
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $failed = Join-Path $env:RUNNER_TEMP 'first-run-failed.log'
          Copy-Item -LiteralPath build/Testing/Temporary/LastTestsFailed.log -Destination $failed
          ctest --test-dir build -C Release --output-on-failure --rerun-failed
          node scripts/ci/flaky-gate.mjs --failed $failed --rerun-exit $LASTEXITCODE --quarantine docs/quality/flaky-quarantine.txt
          exit $LASTEXITCODE

      - name: Start and quit the app
        timeout-minutes: 5
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          KA_HGIS_LOG_DIR: ${{ github.workspace }}\build\test-logs\app-smoke
        run: |
          . .\scripts\dev-env.ps1
          $p = Start-Process -FilePath build\Release\ka-hgis.exe -ArgumentList '--smoke-quit' -WorkingDirectory build\Release -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ka-hgis --smoke-quit exit $($p.ExitCode)" }

      # Reference runners use ASCII TEMP; Korean-path PCs do not.
      # CTest ENVIRONMENT pins TEMP to the configure-time path, so run the
      # workflow exe directly under a Hangul TEMP (same class as P0-2).
      - name: Workflow tests under Korean TEMP
        timeout-minutes: 20
        shell: pwsh
        env:
          # Relative to the workspace (the step's working directory): Qt splits the platform
          # string at ':', so an absolute D:\... path became config file "D" and aborted the
          # exe with 0xC0000409 before any test ran (docs/ERROR_REGRESSION.md).
          QT_QPA_PLATFORM: offscreen:configfile=cmake/offscreen-1920.json
          # A fatal Qt message (no console on the runner) goes to the step log, not the debugger.
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          # Hangul path via codepoints so the YAML stays ASCII-safe in editors.
          $hangul = ([string][char]0xD55C) + ([string][char]0xAE00) + ([string][char]0xC784) + ([string][char]0xC2DC)
          $koreanTemp = Join-Path $env:RUNNER_TEMP ("ka-hgis-" + $hangul)
          New-Item -ItemType Directory -Force -Path $koreanTemp | Out-Null
          $env:TEMP = $koreanTemp
          $env:TMP = $koreanTemp
          Write-Host "TEMP=$env:TEMP"
          $exe = Join-Path (Resolve-Path .\build\Release).Path 'ka_workflow_tests.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing $exe" }
          # The log path stays ASCII: on the runner's code page 1252 a Hangul path reaches
          # the exe's argv as '????' and QtTest cannot open its log file.
          $log = Join-Path $env:RUNNER_TEMP 'workflow_korean_temp.txt'
          & $exe -o "$log,txt"
          $code = $LASTEXITCODE
          Write-Output "korean_temp_exe_exit=$code"
          if ($code -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            exit $code
          }

      # CTest and the Korean-TEMP step already ran the test executables and "Start and quit the app"
      # started the app; e2e-smoke only adds the rule-file and hard-coded-path checks here.
      - name: E2E smoke
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          .\scripts\e2e-smoke.ps1 -SkipTests -SkipSmoke

      # A step that times out is cancelled, not failed, so upload in both cases.
      - name: Upload test logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: build/test-logs
          if-no-files-found: ignore
          overwrite: true
