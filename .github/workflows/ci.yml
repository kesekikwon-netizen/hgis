name: CI

on:
  push:
    # Work lives on dated branches (e.g. 20260922-1) long before it reaches main.
    branches: [main, '20*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs on GitHub-hosted runners — no OSGeo4W required
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required paths exist
        run: |
          set -euo pipefail
          test -f CMakeLists.txt
          test -f README.md
          test -f LICENSE
          test -f VERSION
          test -f VERSION_QGIS_PIN.txt
          test -f data/rules/drawing_checklist.v1.json
          test -f data/schemas/ka_hgis_layers.yaml
          test -f src/app/main.cpp
          test -f src/core/ChecklistEngine.cpp
          test -f tests/test_checklist.cpp
          test -f scripts/dev-env.ps1
          test -f scripts/run-ka-hgis.ps1
          test -f scripts/e2e-smoke.ps1
          echo "Required paths OK"

      # These files keep their UTF-8 BOM on purpose: Windows PowerShell 5.1 reads
      # BOM-less UTF-8 as the ANSI code page (CP949), and scripts/e2e-smoke.ps1
      # reads the checklist without -Encoding. Accept the BOM here instead.
      - name: Validate checklist JSON
        run: python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' data/rules/drawing_checklist.v1.json

      - name: Validate sample survey JSON
        run: |
          set -euo pipefail
          for f in samples/demo_survey/demo.ka-survey.json samples/bad_survey/bad.ka-survey.json; do
            python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$f"
          done

      - name: CMakeLists basic shape
        run: |
          set -euo pipefail
          grep -q 'project(ka-hgis' CMakeLists.txt
          grep -q 'add_executable(ka-hgis' CMakeLists.txt
          grep -q 'add_library(ka_core' CMakeLists.txt
          grep -q 'KA_HGIS_BUILD_TESTS' CMakeLists.txt
          echo "CMakeLists shape OK"

  # Full Windows build — needs a self-hosted runner with OSGeo4W + VS2022
  # Register runner: https://github.com/kwonyoungin11/hgis/settings/actions/runners
  # Labels must include: self-hosted, Windows, ka-hgis
  windows-build:
    name: Windows build (self-hosted)
    needs: sanity
    if: ${{ vars.ENABLE_SELF_HOSTED_BUILD == 'true' }}
    runs-on: [self-hosted, Windows, ka-hgis]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure (VS 2022 x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DKA_HGIS_BUILD_TESTS=ON

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          cmake --build build --config Release

      - name: clang-tidy changed lines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          .\scripts\gen-compile-commands.ps1
          .\scripts\clang-tidy-changed.ps1 -Base HEAD^

      - name: CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          ctest --test-dir build -C Release --output-on-failure

      - name: Smoke quit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          .\scripts\run-ka-hgis.ps1 --smoke-quit

      - name: E2E smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\dev-env.ps1
          .\scripts\e2e-smoke.ps1
