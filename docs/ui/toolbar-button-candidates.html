<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ka-hgis 툴바 버튼 후보 5</title>
<style>
  :root { font-family: "Malgun Gothic", sans-serif; color: #1F2328; }
  body { margin: 24px; background: #F2F3F5; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .lead { color: #6E757D; margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button {
    border: 1px solid #D5D9DE; background: #fff; border-radius: 8px;
    padding: 8px 12px; font-weight: 700; cursor: pointer;
  }
  .tabs button.on { outline: 2px solid #124B94; }
  .stage { background: #fff; border: 1px solid #D5D9DE; border-radius: 10px; padding: 12px; }
  .bar { display: flex; gap: 4px; align-items: stretch; padding: 6px 8px; border-bottom: 1px solid #D5D9DE; }
  .btn {
    min-width: 56px; height: 58px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 600; color: #575E66; cursor: pointer;
    background: #fff; border: 1px solid #D5D9DE; border-radius: 8px;
  }
  .ico { width: 22px; height: 22px; border-radius: 3px; background: #4C535B; }
  .sep { width: 1px; background: #C3C8CF; margin: 8px 6px; }
  .note { margin-top: 12px; color: #6E757D; font-size: 13px; }
  /* A */
  .a .btn.on { background: #E8F0FA; color: #124B94; border-color: #1E67C6; font-weight: 700; }
  .a .btn.on .ico { background: #124B94; }
  /* B */
  .b .btn { background: transparent; border-color: transparent; }
  .b .btn.on { background: transparent; color: #124B94; border-color: transparent;
    box-shadow: inset 0 -2px 0 #1E67C6; font-weight: 700; }
  .b .btn.on .ico { background: #124B94; }
  /* C */
  .c .btn { background: #fff; border-color: #C3C8CF; }
  .c .btn.on { background: #F7F8FA; color: #1F2328; border-color: #124B94; }
  /* D */
  .d .btn { background: transparent; border-color: transparent; }
  .d .btn.on { background: transparent; color: #124B94; border-color: transparent; font-weight: 700; }
  .d .btn.on .ico { background: #124B94; }
  /* E */
  .e .group { display: flex; background: #E9EBEE; border-radius: 12px; padding: 3px; gap: 2px; }
  .e .group .btn { border: none; background: transparent; }
  .e .group .btn.on { background: #fff; color: #1F2328; font-weight: 700; }
</style>
</head>
<body>
<div style="margin:8px 0 16px;padding:10px 12px;border:1px solid #DCE3EA;background:#F4F8FC;color:#12558D;font-size:13px">옛 후보 비교(설계 기록, 현재 화면 아님). 지금 앱은 강조색 <b>#1F6FB2</b>(hover #185E99, deep #12558D)을 쓰고, 리본은 A안(칩 채움) 한 가지로 체크 상태를 보인다. 아래 hex(#124B94/#1E67C6)는 비교 당시 값이다. 정본은 src/app/KaTheme.cpp 와 data/theme/ka-hgis.qss.</div>
  <h1>툴바 버튼 후보 5</h1>
  <p class="lead">DEM을 켠 상태로 비교합니다. 버튼을 눌러 켜짐을 바꿔 보세요. 파란 면이 남으면 안 됩니다.</p>
  <div class="tabs">
    <button class="on" data-k="a">A Soft Chip · 권장</button>
    <button data-k="b">B Underline</button>
    <button data-k="c">C Engraved</button>
    <button data-k="d">D Icon-tint</button>
    <button data-k="e">E Capsule</button>
  </div>
  <div class="stage">
    <div id="bar" class="bar a"></div>
    <p class="note" id="note"></p>
  </div>
<script>
const notes = {
  a: "A Soft Chip — 연한 워시 + 남색 테두리. 지금 앱에 적용된 안.",
  b: "B Underline — 아래 선만. 배경은 항상 흰 바탕.",
  c: "C Engraved — 흰 타일이 살짝 눌린 기기 패널.",
  d: "D Icon-tint — 배경은 그대로, 글자·아이콘만 남색.",
  e: "E Capsule — 지형맵·DEM·토양도가 한 트랙 안 흰 알약."
};
const tools = [
  ["새조사"],["열기"],["저장"],"|",["선택"],["줄자"],["그리기"],["시굴격자"],"|",
  ["지형맵"],["DEM", true],["토양도"],["고지형"],["지질도"],["수계도"]
];
function render(kind) {
  const bar = document.getElementById("bar");
  bar.className = "bar " + kind;
  bar.innerHTML = "";
  const wrapE = kind === "e" ? document.createElement("div") : null;
  if (wrapE) { wrapE.className = "group"; }
  tools.forEach((t, i) => {
    if (t[0] === "|") { bar.appendChild(Object.assign(document.createElement("div"), {className:"sep"})); return; }
    const b = document.createElement("button");
    b.className = "btn" + (t[1] ? " on" : "");
    b.innerHTML = '<span class="ico"></span>' + t[0];
    b.onclick = () => { b.classList.toggle("on"); };
    if (wrapE && i >= 9) wrapE.appendChild(b);
    else bar.appendChild(b);
  });
  if (wrapE) bar.appendChild(wrapE);
  document.getElementById("note").textContent = notes[kind];
}
document.querySelectorAll(".tabs button").forEach((tb) => {
  tb.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === tb));
    render(tb.dataset.k);
  };
});
render("a");
</script>
</body>
</html>
